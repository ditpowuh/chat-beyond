name: Release Build CD

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: windows
            file_name: ChatBeyond-windows-x64.exe
            zip_name: ChatBeyond-windows-x64.zip
          - os: macos-latest
            target: mac
            file_name: ChatBeyond-macos-arm64
            zip_name: ChatBeyond-macos-arm64.zip

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Install dependencies
      run: bun install

    - name: Build server code for ${{ matrix.os }}
      run: bun run build:${{ matrix.target }}

    - name: Build client code
      run: bun run client:build

    - name: Zip windows-x64 build output
      shell: pwsh
      run: Compress-Archive -Path "output/${{ matrix.file_name }}", "public" -DestinationPath "${{ matrix.zip_name }}"

    - name: Upload to GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        files: ${{ matrix.zip_name }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
